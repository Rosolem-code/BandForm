
<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscrição para a Banda da Escola</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <form action="mysql" method="post">

        <h1>Teste para Banda</h1>

        <label for="nome"></label>
        <input type="text" id="nome" name="nome" placeholder="Seu nome">

        <br><br>

        <label for="idade"></label>
        <input type="number" id="idade" name="idade" placeholder="Idade">

        <br><br>

        <label for="instrumento"></label>
        <input type="text" id="instrumento" name="instrumento" placeholder="Qual instrumento você toca?">

        <br><br>

        <button type="submit">Finalizar</button>

    </form>

</body>

</html>
